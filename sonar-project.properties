# SonarQube configuration for visualization.matrix
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=visualization.matrix
sonar.projectName=visualization.matrix
sonar.projectVersion=1.0

# Source files
sonar.sources=src,lib
sonar.exclusions=**/build/**,**/.git/**,**/visualization.matrix/**

# Language settings
sonar.language=c++
sonar.cxx.standard=c++17
sonar.cxx.compiler=gcc

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.cxx.coverage.reportPaths=build/coverage.info
sonar.cxx.coverage.forceDeprecatedJavaVersion=false

# External reports
sonar.cxx.clang-tidy.report-path=build/clang-tidy-report.txt
sonar.cxx.cppcheck.report-path=build/cppcheck-report.txt

# Quality profiles
sonar.profile=Sonar way

# Rules
sonar.cxx.valgrind.reportPath=build/valgrind-report.xml
sonar.cxx.xunit.reportPath=build/test-results.xml

# Security
sonar.security.hotspot.review.enabled=true
sonar.security.scan.type=FULL
