name: Build and Test

on:
  push:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'
  pull_request:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'

jobs:
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/CMake
          build/
        key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make libgl1-mesa-dev libglu1-mesa-dev

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Debug ..

    - name: Build project
      run: |
        cd build
        make -j$(nproc)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: build/
        retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~\.cache\CMake
          build\*
        key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install dependencies
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Debug ..

    - name: Build project
      run: |
        cd build
        cmake --build . --config Debug --parallel %NUMBER_OF_PROCESSORS%

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: build/
        retention-days: 7

  test:
    name: Test
    needs: [build-linux]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-build
        path: build

    - name: Run tests (if available)
      run: |
        cd build
        ctest --output-on-failure || echo "No tests found"
