name: Main CI/CD Pipeline

on:
  push:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'
      - 'Dockerfile'
  pull_request:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run tests'
        required: false
        default: 'true'
      run-security:
        description: 'Run security scans'
        required: false
        default: 'true'
      run-build:
        description: 'Run builds'
        required: false
        default: 'true'

jobs:
  # Static Analysis Jobs
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [codeql, clang-tidy, cppcheck]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for CodeQL

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/clang-tidy
          ~/.cache/cppcheck
          ~/.cache/CMake
        key: ${{ runner.os }}-${{ matrix.tool }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.tool }}-

    - name: Install dependencies
      if: matrix.tool != 'codeql'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14 cmake ninja-build cppcheck

    - name: Run CodeQL
      if: matrix.tool == 'codeql'
      uses: github/codeql-action/analyze@v3
      with:
        languages: cpp
        queries: security-and-quality

    - name: Run clang-tidy
      if: matrix.tool == 'clang-tidy'
      run: |
        mkdir -p build && cd build
        cmake -G Ninja -DCMAKE_CXX_CLANG_TIDY="clang-tidy-14;-checks=*;-warnings-as-errors=*" ..
        ninja -j$(nproc)

    - name: Run cppcheck
      if: matrix.tool == 'cppcheck'
      run: |
        cppcheck --enable=all --inconclusive --std=c++17 src/ lib/ --error-exitcode=1

  # Security Scan Jobs
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [trivy, snyk]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache security tools
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/trivy
          ~/.cache/snyk
        key: ${{ runner.os }}-security-${{ matrix.tool }}-${{ hashFiles('.') }}
        restore-keys: |
          ${{ runner.os }}-security-${{ matrix.tool }}-

    - name: Run Trivy
      if: matrix.tool == 'trivy'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Upload Trivy SARIF
      if: matrix.tool == 'trivy'
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk
      if: matrix.tool == 'snyk'
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=high

  # Build Jobs
  build:
    name: Build
    needs: [static-analysis, security-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: "Linux (Debug)"
            build_type: Debug
            cmake_flags: ""
          - name: "Linux (Release)"
            build_type: Release
            cmake_flags: "-DCMAKE_BUILD_TYPE=Release"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/CMake
          build/
        key: ${{ runner.os }}-cmake-${{ matrix.config.build_type }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-${{ matrix.config.build_type }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make libgl1-mesa-dev libglu1-mesa-dev ninja-build

    - name: Configure CMake
      run: |
        mkdir -p build && cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} ..

    - name: Build project
      run: |
        cd build
        ninja -j$(nproc)

    - name: Run tests (if available)
      run: |
        cd build
        ctest --output-on-failure || echo "No tests found"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.config.name }}
        path: build/
        retention-days: 7

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: false
        tags: visualization.matrix:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Test Docker image
      run: |
        docker run --rm visualization.matrix:latest echo "Docker build test successful"

  # SBOM Generation
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: [build]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Syft
      uses: actions/cache@v3
      with:
        path: ~/.cache/syft
        key: ${{ runner.os }}-syft-${{ hashFiles('.') }}
        restore-keys: |
          ${{ runner.os }}-syft-

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM
      run: |
        syft dir:. -o spdx-json --file sbom.spdx.json
        syft dir:. -o cyclonedx-json --file sbom.cyclonedx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom.spdx.json
          sbom.cyclonedx.json
        retention-days: 30

  # Performance Benchmark (optional)
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-Linux (Release)
        path: build

    - name: Run performance tests
      run: |
        cd build
        # Placeholder for actual benchmark commands
        echo "Performance benchmarking would run here"
