name: CI Pipeline

on:
  push:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'
  pull_request:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
      - 'lib/**'
      - 'src/**'

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [codeql, clang-tidy, cppcheck]
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/clang-tidy
          ~/.cache/cppcheck
          ~/.cache/CMake
        key: ${{ runner.os }}-${{ matrix.tool }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.tool }}-

    - name: Run CodeQL
      if: matrix.tool == 'codeql'
      uses: github/codeql-action/analyze@v3
      with:
        languages: cpp

    - name: Run clang-tidy
      if: matrix.tool == 'clang-tidy'
      run: |
        sudo apt-get update && sudo apt-get install -y clang-tidy-14 cmake ninja-build
        mkdir -p build && cd build
        cmake -G Ninja -DCMAKE_CXX_CLANG_TIDY="clang-tidy-14;-checks=*;-warnings-as-errors=*" ..
        ninja -j$(nproc)

    - name: Run cppcheck
      if: matrix.tool == 'cppcheck'
      run: |
        sudo apt-get update && sudo apt-get install -y cppcheck
        cppcheck --enable=all --inconclusive --std=c++17 src/ lib/ --error-exitcode=1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [trivy]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Trivy
      uses: actions/cache@v3
      with:
        path: ~/.cache/trivy
        key: ${{ runner.os }}-trivy-${{ hashFiles('.') }}
        restore-keys: |
          ${{ runner.os }}-trivy-

    - name: Run Trivy
      if: matrix.tool == 'trivy'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Syft
      uses: actions/cache@v3
      with:
        path: ~/.cache/syft
        key: ${{ runner.os }}-syft-${{ hashFiles('.') }}
        restore-keys: |
          ${{ runner.os }}-syft-

    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM
      run: |
        syft dir:. -o spdx-json --file sbom.spdx.json
        syft dir:. -o cyclonedx-json --file sbom.cyclonedx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: |
          sbom.spdx.json
          sbom.cyclonedx.json

  build:
    name: Build
    needs: [static-analysis, security-scan]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache CMake
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/CMake
          build/
        key: ${{ runner.os }}-cmake-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make libgl1-mesa-dev

    - name: Build project
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Debug ..
        make -j$(nproc)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/
