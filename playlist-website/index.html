<title>Eurodance & French Touch Time Capsule — Extended Mixes</title>
<style>
  :root {
    --bg: #0a0a12;
    --bg-elev: #12121f;
    --bg-card: #1a1a2e;
    --bg-card-hover: #22223e;
    --border: #2a2a4a;
    --text: #e8e8f0;
    --text-dim: #9090b0;
    --accent: #ff2d95;
    --accent-2: #00e5ff;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255,45,149,0.08), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(0,229,255,0.08), transparent 50%);
  }
  /* Header */
  header {
    padding: 3rem 1.5rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,45,149,0.05), transparent);
  }
  header h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-dim);
    font-size: 1.05rem;
    max-width: 720px;
    margin: 0 auto 1.5rem;
  }
  /* Stats bar */
  .stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent-2);
  }
  .stat-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  /* Filters */
  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(10,10,18,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    justify-content: center;
  }
  .filters label {
    font-size: 0.8rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 0.5rem;
  }
  .filters select {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  .filters select:focus, .filters select:hover {
    border-color: var(--accent);
  }
  .search-box {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.85rem;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  /* Phases */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  .phase {
    margin-bottom: 3rem;
  }
  .phase-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
  }
  .phase-num {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    background: rgba(255,45,149,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
  }
  .phase-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }
  .phase-years {
    margin-left: auto;
    font-size: 0.85rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  /* Track grid */
  .tracks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }
  .track {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .track:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .track-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .track-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 24px;
  }
  .track-flag {
    font-size: 1.1rem;
    line-height: 1;
  }
  .track-year {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: auto;
  }
  .track-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-top: 0.25rem;
  }
  .track-artist {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .track-link {
    margin-top: 0.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-2);
    text-decoration: none;
    transition: color 0.2s;
  }
  .track-link:hover { color: var(--accent); }
  .track-link::before { content: '▶'; }
  .track[data-available="false"] .track-link {
    color: var(--text-dim);
    pointer-events: none;
  }
  .track[data-available="false"] .track-link::before { content: '⊘'; }
  /* Footer */
  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  footer a {
    color: var(--accent-2);
    text-decoration: none;
  }
  /* Responsive */
  @media (max-width: 640px) {
    .tracks { grid-template-columns: 1fr; }
    .stats { gap: 1rem; }
    .filters { flex-direction: column; align-items: stretch; }
    .search-box { width: 100%; }
  }
  /* No results */
  .no-results {
    text-align: center;
    padding: 3rem;
    color: var(--text-dim);
  }
</style>
</head>

  const t = tracks.find(x => x.phase === p);
  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = `Phase ${p}: ${t.phaseTitle}`;
  phaseSelect.appendChild(opt);
});
countries.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  opt.textContent = c;
  countrySelect.appendChild(opt);
});

  main.innerHTML = '';

  const filtered = tracks.filter(t => {
    if (phaseFilter && t.phase !== phaseFilter) return false;
    if (countryFilter && t.country !== countryFilter) return false;
    if (searchTerm) {
      const hay = (t.title + ' ' + t.artist + ' ' + t.country).toLowerCase();
      if (!hay.includes(searchTerm)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    main.innerHTML = '<div class="no-results">Keine Tracks gefunden. Filter anpassen.</div>';
    return;
  }

  // Group by phase
  const grouped = {};
  filtered.forEach(t => {
    if (!grouped[t.phase]) grouped[t.phase] = { title: t.phaseTitle, years: t.phaseYears, items: [] };
    grouped[t.phase].items.push(t);
  });

  Object.keys(grouped).sort().forEach(phaseKey => {
    const group = grouped[phaseKey];
    const section = document.createElement('section');
    section.className = 'phase';
    section.innerHTML = `
      <div class="phase-header">
        <span class="phase-num">Phase ${phaseKey}</span>
        <span class="phase-title">${group.title}</span>
        <span class="phase-years">${group.years}</span>
      </div>
      <div class="tracks"></div>
    `;
    const grid = section.querySelector('.tracks');
    group.items.forEach(t => {
      const card = document.createElement('div');
      card.className = 'track';
      card.dataset.available = t.available;
      const linkLabel = t.available ? 'Spotify Extended' : (t.url.includes('discogs') ? 'Discogs' : 'Artist-Seite');
      card.innerHTML = `
        <div class="track-top">
          <span class="track-num">${String(t.n).padStart(2,'0')}</span>
          <span class="track-flag">${t.flag}</span>
          <span class="track-year">${t.year}</span>
        </div>
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.artist}</div>
        <a class="track-link" href="${t.url}" target="_blank" rel="noopener">${linkLabel}</a>
      `;
      grid.appendChild(card);
    });
    main.appendChild(section);
  });
}

// Event listeners
phaseSelect.addEventListener('change', render);
countrySelect.addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);

// Initial render
render();
</script>
</body>
</html>
