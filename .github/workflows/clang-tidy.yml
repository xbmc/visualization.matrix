name: clang-tidy

on:
  push:
    branches: [ master, Matrix, Nexus ]
  pull_request:
    branches: [ master, Matrix, Nexus ]

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14 lld-14 cmake ninja-build

    - name: Run clang-tidy
      run: |
        # Create a build directory
        mkdir -p build
        cd build
        
        # Generate compile_commands.json using CMake and Ninja
        cmake -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang ..
        
        # Run clang-tidy on all source files
        find ../src -name "*.cpp" -o -name "*.h" | xargs -I {} clang-tidy-14 {} -p . --warnings-as-errors=* -quiet
