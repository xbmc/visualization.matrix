name: clang-tidy

on:
  push:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ master, Matrix, Nexus ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.c'
      - 'CMakeLists.txt'

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14 lld-14 cmake ninja-build

    - name: Cache CMake build
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/clang-tidy
          build/
        key: ${{ runner.os }}-clang-tidy-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/**') }}
        restore-keys: |
          ${{ runner.os }}-clang-tidy-

    - name: Configure CMake with clang-tidy
      run: |
        mkdir -p build
        cd build
        
        # Generate compile_commands.json with clang-tidy flags
        cmake -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_CLANG_TIDY="clang-tidy-14;-checks=*,-modernize-use-trailing-return-type;-warnings-as-errors=*;-quiet" \
          ..

    - name: Build project
      run: |
        cd build
        ninja -j$(nproc)

    - name: Run clang-tidy
      run: |
        cd build
        # Run clang-tidy on all compilation units
        ninja -t commands | xargs -I {} sh -c '{} 2>&1 | grep -v "^Checking" | grep -v "^Supppression"' || true
